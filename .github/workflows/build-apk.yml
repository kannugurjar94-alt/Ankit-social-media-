name: Build and Release Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK exists
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: app/build/outputs/apk/debug/app-debug.apk not found!" >&2
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.0-build.${{ github.run_number }}.${{ github.run_attempt }}"
          TITLE="AnkitVerse Debug Build #${{ github.run_number }} (Attempt ${{ github.run_attempt }})"
          gh release create "$TAG_NAME" \
            "app/build/outputs/apk/debug/app-debug.apk#app-debug.apk" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "Automated build of AnkitVerse Debug APK for commit ${{ github.sha }}." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.0-build.${{ github.run_number }}.${{ github.run_attempt }}"
          APK_FILENAME="app-debug.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Publishing Succeeded ==="
            RELEASE_TAG=$(gh release view "$TAG_NAME" --json tagName -q .tagName)
            RELEASE_TITLE=$(gh release view "$TAG_NAME" --json title -q .title)
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url)

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $APK_FILENAME"

            echo "### 🚀 APK Download Available" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK has been published to the GitHub Release:" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page:** [$RELEASE_TITLE]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Download:** The APK (\`$APK_FILENAME\`) can be downloaded directly from the release **Assets** section." >> $GITHUB_STEP_SUMMARY
            echo "- **Backup:** The normal Actions artifact (\`app-debug-apk\`) is also available as a backup under the workflow run summary." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "The APK build succeeded, and the Actions artifact named 'app-debug-apk' remains available."

            echo "### ⚠️ Release Publishing Warning" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **Notice:** The APK build succeeded, but publishing to GitHub Releases encountered an error or was skipped." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The verified debug APK is safely preserved and available for download:" >> $GITHUB_STEP_SUMMARY
            echo "- **Actions Artifact:** Download \`app-debug-apk\` from the **Artifacts** section at the bottom of this workflow run summary." >> $GITHUB_STEP_SUMMARY
          fi
